[package]
name = "gens-relay-desktop"
version = "2.0.0"
description = "Gens-Relay Windows Desktop Client"
authors = ["WilliamBossard"]
edition = "2021"

[lib]
name = "gens_relay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

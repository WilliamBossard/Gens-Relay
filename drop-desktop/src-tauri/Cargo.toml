[package]
name = "gens-drop-desktop"
version = "2.0.0"
description = "Gens-Drop Compact Blip-Style P2P File Drop App"
authors = ["WilliamBossard"]
edition = "2021"

[lib]
name = "gens_drop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
